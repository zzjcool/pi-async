name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: ci
    # Pinned, not ubuntu-latest: the label migrates to Ubuntu 26 on
    # 2026-10-19 (runner-images#14748). Move to 26.04 deliberately.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          cache: npm

      - name: Install
        run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: test
        run: npm test
