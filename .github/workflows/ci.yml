name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: ci (node ${{ matrix.node }})
    # Pinned, not ubuntu-latest: the label migrates to Ubuntu 26 on
    # 2026-10-19 (runner-images#14748). Move to 26.04 deliberately.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          cache: npm

      - name: Install
        run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: test
        run: npm test

      - name: Package contents
        run: npm pack --dry-run

  # The typecheck/test baseline above runs against the peer-dependency
  # versions npm resolves for ^1.2.0. This job re-runs both against the
  # newest supported host (pi 1.5.0) so host-side validation changes
  # (pi 1.5.0 moved tool-argument validation to @earendil-works/pi-schema)
  # cannot land silently broken.
  pi-1-5:
    name: pi 1.5.0 compat
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          cache: npm

      - name: Install
        run: npm ci

      - name: Install pi 1.5.0 type baseline
        run: >-
          npm install --no-save
          @earendil-works/pi-coding-agent@1.5.0
          @earendil-works/pi-tui@1.5.0

      - name: typecheck against pi 1.5.0
        run: npm run typecheck

      - name: test against pi 1.5.0
        run: npm test

      - name: Package contents
        run: npm pack --dry-run

  # Branch protection on main requires a status check named exactly "ci".
  # The matrix job above reports "ci (node 22)" / "ci (node 24)", so this
  # aggregation job carries the required name and fails if either lane failed.
  ci-gate:
    name: ci
    needs: [ci, pi-1-5]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify required jobs
        shell: bash
        run: |
          set -euo pipefail
          echo "matrix ci: ${{ needs.ci.result }}"
          echo "pi 1.5.0 compat: ${{ needs['pi-1-5'].result }}"
          test "${{ needs.ci.result }}" = "success"
          test "${{ needs['pi-1-5'].result }}" = "success"
