name: Release

# Tags are created by a maintainer (see docs/PLAN-0.3.0.md §6); this workflow
# never creates its own tag. It runs on a `v*` tag push, or manually via
# `gh workflow run release.yml --ref main` (used to publish the current
# package.json version when the tag already exists, e.g. 0.3.0).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # gh release create
  id-token: write # npm publish --provenance (OIDC)

jobs:
  publish:
    name: publish
    # Pinned, not ubuntu-latest: the label migrates to Ubuntu 26 on
    # 2026-10-19 (runner-images#14748). Move to 26.04 deliberately.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: npm ci

      # Trusted Publishing needs npm >= 11.5.1 (Node 22 still bundles npm 10.x).
      # 11.15+ also supports the `npm trust` CLI. No NODE_AUTH_TOKEN is set:
      # npm detects the GitHub OIDC environment and exchanges it automatically.
      - name: Upgrade npm for Trusted Publishing
        run: |
          npm install -g 'npm@^11.15.0'
          npm --version

      - name: Verify
        run: npm run verify

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi

      - name: Publish to npm
        # No NODE_AUTH_TOKEN: Trusted Publishing (OIDC) replaces it.
        run: npm publish --provenance

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --generate-notes
