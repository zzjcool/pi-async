name: Release

# Tags are created by a maintainer (see docs/PLAN-0.3.0.md §6); this workflow
# never creates its own tag. It runs only when a `v*` tag is pushed.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # gh release create
  id-token: write # npm publish --provenance (OIDC)

jobs:
  publish:
    name: publish
    # Pinned, not ubuntu-latest: the label migrates to Ubuntu 26 on
    # 2026-10-19 (runner-images#14748). Move to 26.04 deliberately.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Check tag matches package version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes
